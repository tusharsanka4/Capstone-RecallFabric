<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RecallFabric</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      width: 280px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    h3 {
      margin: 0;
      color: #38bdf8;
      font-size: 1rem;
    }
    .status-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #334155;
    }
    .online {
      background: #14532d;
      color: #86efac;
    }
    .offline {
      background: #7f1d1d;
      color: #fca5a5;
    }
    .profile-box {
      background: #1e293b;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.8rem;
      margin-bottom: 12px;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #cbd5e1;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover {
      background: #0369a1;
    }
    .footer {
      margin-top: 10px;
      text-align: right;
    }
    .footer a {
      color: #94a3b8;
      font-size: 0.75rem;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>🧠 RecallFabric</h3>
    <span id="connStatus" class="status-badge">Checking...</span>
  </div>

  <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">Active User Profile:</div>
  <div id="profileSummary" class="profile-box">Loading profile memories...</div>

  <button id="openOptions">Configure Settings</button>

  <div class="footer">
    <a href="https://github.com/tusharsanka4/Capstone-RecallFabric" target="_blank">Docs & Support</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
