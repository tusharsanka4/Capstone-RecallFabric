[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recallfabric-client"
version = "0.1.0"
description = "Official Python client SDK for RecallFabric memory and context service"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "RecallFabric Team" }]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
all = [
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["recallfabric_client"]
