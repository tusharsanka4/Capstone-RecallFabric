services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RECALLFABRIC_APP_NAME: ${RECALLFABRIC_APP_NAME:-RecallFabric}
      RECALLFABRIC_ENVIRONMENT: ${RECALLFABRIC_ENVIRONMENT:-development}
      RECALLFABRIC_LOG_LEVEL: ${RECALLFABRIC_LOG_LEVEL:-INFO}
      RECALLFABRIC_DB_HOST: db
      RECALLFABRIC_DB_PORT: 5432
      RECALLFABRIC_DB_NAME: ${RECALLFABRIC_DB_NAME:-recallfabric}
      RECALLFABRIC_DB_USER: ${RECALLFABRIC_DB_USER:-recallfabric}
      RECALLFABRIC_DB_PASSWORD: ${RECALLFABRIC_DB_PASSWORD:?Set RECALLFABRIC_DB_PASSWORD}
      RECALLFABRIC_DB_SSLMODE: ${RECALLFABRIC_DB_SSLMODE:-prefer}
      RECALLFABRIC_RUN_MIGRATIONS: "true"
      RECALLFABRIC_EMBEDDING_PROVIDER: ${RECALLFABRIC_EMBEDDING_PROVIDER:-fastembed}
      RECALLFABRIC_EMBEDDING_MODEL: ${RECALLFABRIC_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      RECALLFABRIC_EMBEDDING_CACHE_DIR: /app/.model-cache
      RECALLFABRIC_EMBEDDING_THREADS: ${RECALLFABRIC_EMBEDDING_THREADS:-2}
      RECALLFABRIC_LLM_PROVIDER: ${RECALLFABRIC_LLM_PROVIDER:-ollama}
      RECALLFABRIC_CHAT_PROVIDER: ${RECALLFABRIC_CHAT_PROVIDER:-ollama}
      RECALLFABRIC_EXTRACTION_PROVIDER: ${RECALLFABRIC_EXTRACTION_PROVIDER:-ollama}
      RECALLFABRIC_LLM_BASE_URL: ${RECALLFABRIC_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      RECALLFABRIC_CHAT_MODEL: ${RECALLFABRIC_CHAT_MODEL:-qwen2.5:3b-instruct}
      RECALLFABRIC_EXTRACTION_MODEL: ${RECALLFABRIC_EXTRACTION_MODEL:-qwen2.5:3b-instruct}
      RECALLFABRIC_LLM_API_KEY: ${RECALLFABRIC_LLM_API_KEY:-ollama}
      RECALLFABRIC_LLM_TIMEOUT: ${RECALLFABRIC_LLM_TIMEOUT:-60.0}
      RECALLFABRIC_OPENAI_API_KEY: ${RECALLFABRIC_OPENAI_API_KEY:-}
      RECALLFABRIC_OPENAI_BASE_URL: ${RECALLFABRIC_OPENAI_BASE_URL:-https://api.openai.com/v1}
      RECALLFABRIC_OPENAI_MODEL: ${RECALLFABRIC_OPENAI_MODEL:-gpt-4o-mini}
      RECALLFABRIC_OPENAI_CHAT_MODEL: ${RECALLFABRIC_OPENAI_CHAT_MODEL:-}
      RECALLFABRIC_OPENAI_EXTRACTION_MODEL: ${RECALLFABRIC_OPENAI_EXTRACTION_MODEL:-}
      RECALLFABRIC_ANTHROPIC_API_KEY: ${RECALLFABRIC_ANTHROPIC_API_KEY:-}
      RECALLFABRIC_ANTHROPIC_BASE_URL: ${RECALLFABRIC_ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      RECALLFABRIC_ANTHROPIC_MODEL: ${RECALLFABRIC_ANTHROPIC_MODEL:-claude-3-haiku-20240307}
      RECALLFABRIC_ANTHROPIC_CHAT_MODEL: ${RECALLFABRIC_ANTHROPIC_CHAT_MODEL:-}
      RECALLFABRIC_ANTHROPIC_EXTRACTION_MODEL: ${RECALLFABRIC_ANTHROPIC_EXTRACTION_MODEL:-}
      RECALLFABRIC_GEMINI_API_KEY: ${RECALLFABRIC_GEMINI_API_KEY:-}
      RECALLFABRIC_GEMINI_BASE_URL: ${RECALLFABRIC_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      RECALLFABRIC_GEMINI_MODEL: ${RECALLFABRIC_GEMINI_MODEL:-gemini-1.5-flash}
      RECALLFABRIC_GEMINI_CHAT_MODEL: ${RECALLFABRIC_GEMINI_CHAT_MODEL:-}
      RECALLFABRIC_GEMINI_EXTRACTION_MODEL: ${RECALLFABRIC_GEMINI_EXTRACTION_MODEL:-}
      RECALLFABRIC_AUTH_ENABLED: ${RECALLFABRIC_AUTH_ENABLED:-false}
      RECALLFABRIC_ADMIN_TOKEN: ${RECALLFABRIC_ADMIN_TOKEN:-}
      RECALLFABRIC_ENCRYPTION_KEY: ${RECALLFABRIC_ENCRYPTION_KEY:-}
      RECALLFABRIC_MCP_TRANSPORT: ${RECALLFABRIC_MCP_TRANSPORT:-streamable-http}
      RECALLFABRIC_MCP_PUBLIC_URL: ${RECALLFABRIC_MCP_PUBLIC_URL:-}
      RECALLFABRIC_OAUTH_AUTHORIZATION_SERVER: ${RECALLFABRIC_OAUTH_AUTHORIZATION_SERVER:-}
      RECALLFABRIC_OAUTH_ISSUER: ${RECALLFABRIC_OAUTH_ISSUER:-}
      RECALLFABRIC_OAUTH_SCOPES: ${RECALLFABRIC_OAUTH_SCOPES:-memory:read memory:write}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
